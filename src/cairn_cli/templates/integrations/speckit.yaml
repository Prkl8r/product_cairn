# GitHub spec-kit: turn the Cairn Spec into a spec-kit feature spec with /speckit-specify.
description: "spec-kit: runs speckit-specify on the packaged Spec. Planning and tasks stay with you."
kind: skill
skill: speckit-specify
expects: .specify
# A different spec-kit version or agent may name the skill differently (e.g. speckit.specify);
# override `skill:` on the target.
# speckit-specify copies this text into its Input line, so it's kept short; the first sentence is
# the Cairn reference.
args: >-
  Cairn Spec {spec_id} (revision {revision}, Thread {thread_id}), at {spec}. Build only from it:
  keep its AC ids, slices, out-of-scope, error and empty states; name the feature for what it
  builds; keep its open questions as open questions, not clarification markers.
