# Cairn project settings. Yours to edit; `cairn init --force` never overwrites this file.

jury:
  # How the debaters get their models, used by jury-duty in Claude Code.
  #   coin  (default): `cairn jury-draw` flips a coin before each jury to decide which of the
  #         Advocate and Skeptic runs on which of `debate_models`, so the stronger model doesn't
  #         always argue for the proposal. The draw is recorded in the verdict's `jury_models`.
  #   fixed: Advocate opus, Skeptic sonnet, every time.
  draw: coin
  debate_models: [opus, sonnet]
  # Pin a seat here to skip the draw for it. Any model Claude Code accepts: opus, sonnet, haiku,
  # or a full model id. Keep the Advocate and Skeptic on different models: that's what makes the
  # critique independent. The Judge defaults to opus.
  models:
    advocate:
    skeptic:
    judge:

handoff:
  # Where the hand-off skill (and `cairn handoff --target`) sends a Specified Spec. A target either
  # names an integration, which knows how to deliver to a build process, or spells out a kind itself.
  #
  # Integrations (`cairn handoff-integrations` lists them):
  #   speckit:   runs /speckit-specify on the packaged Spec. Planning and tasks stay with you.
  #   template:  fills your own spec template and writes it to `out`. Set `template` and `out`.
  #   Your own:  add .cairn/integrations/<name>.yaml for any other SDD process (see the built-ins).
  # A target can override any field of its integration, e.g. a different `skill` or `args`.
  #
  # Or set a kind directly:
  #   skill:     runs another skill with `args`, e.g. a team's own build-from-spec skill.
  #   agent:     hands the package to a subagent with `prompt`.
  #   script:    `cairn handoff --target` runs the `run` command itself. `run` can also use the
  #              target's own fields, e.g. {repo}, so a script can push to another SDD repo.
  #
  # `run`, `args`, `prompt` and `out` can use {package}, {spec} (the packaged spec.md), {spec_id},
  # {revision}, {thread_id} and {root}. The handoff is recorded only after delivery succeeds.
  # Name one as `default:` to skip choosing each time. With no targets, the hand-off skill asks.
  targets:
    # speckit:
    #   integration: speckit
    # our-template:
    #   integration: template
    #   template: docs/templates/feature-spec.md
    #   out: docs/specs/{spec_id}.md
    # zip:
    #   kind: script
    #   run: "python .cairn/handoff.py --package {package} --to export --where my-team"
    # build:
    #   kind: skill
    #   skill: my-plugin:build-from-spec
    #   args: "{spec}"
    # review:
    #   kind: agent
    #   agent: general-purpose
    #   prompt: "Read {spec} and its addendum in {package}, then ..."

# Your own frontmatter keys on signals, Threads, Specs or journeys. `cairn doctor` warns about any key
# no Cairn skill writes (usually a typo, like `fast_track: true` for `track: fast`); list yours here.
extra_keys: []

overviews:
  # How long an overview stays trusted after `last_verified` before check-spec (C16, C24) treats it as
  # stale. Used when an overview has no `review_ttl` of its own, and written into new stub overviews.
  review_ttl: 180d

# Other repos a trace can point into, e.g. a shared compliance library. A ref like
# `lib:compliance/sec-04` then looks for library/sec-04.md (or sec-04.md) in that repo.
# A local path (relative to this repo) is checked like any other ref; a URL can't be checked
# from here, so check-spec warns instead of failing.
repos: {}
